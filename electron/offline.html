<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Proctra — offline</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { opacity: .7; margin: 0 0 1.5rem; }
    button { font: inherit; padding: .6rem 1.4rem; border-radius: .5rem; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Proctra</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry" type="button">Retry</button>
  </main>
  <script>
    const target = new URLSearchParams(location.search).get("retry");
    document.getElementById("retry").addEventListener("click", () => {
      // main.ts only allows navigation to the app origin, so a tampered value goes nowhere.
      if (target) location.href = target;
    });
  </script>
</body>
</html>
